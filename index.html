<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
  }
  .app {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    overflow: hidden;
  }
  header {
    background: #4a5fc1;
    color: #fff;
    padding: 24px;
    text-align: center;
  }
  header h1 { font-size: 24px; font-weight: 600; }
  header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 20px;
    border-bottom: 1px solid #eee;
  }
  #item-input {
    flex: 1;
    padding: 12px 14px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  #item-input:focus { border-color: #4a5fc1; }
  #add-btn {
    padding: 0 20px;
    background: #4a5fc1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  #add-btn:hover { background: #3a4fa8; }
  #add-btn:active { transform: scale(0.97); }
  ul#list {
    list-style: none;
    max-height: 60vh;
    overflow-y: auto;
  }
  ul#list li {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.1s;
  }
  ul#list li:hover { background: #fafafa; }
  ul#list li:last-child { border-bottom: none; }
  ul#list li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #4a5fc1;
  }
  ul#list li .text {
    flex: 1;
    margin-left: 12px;
    font-size: 15px;
    color: #333;
    word-break: break-word;
  }
  ul#list li.checked .text {
    text-decoration: line-through;
    color: #aaa;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #d33;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .delete-btn:hover { background: #fde8e8; }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: #999;
    font-size: 14px;
  }
  footer {
    padding: 14px 20px;
    background: #f7f7fa;
    font-size: 13px;
    color: #666;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #clear-btn {
    background: transparent;
    border: 1px solid #ccc;
    color: #666;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  #clear-btn:hover { background: #eee; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <p>장 볼 항목을 추가하고 체크해보세요</p>
    </header>
    <div class="input-row">
      <input id="item-input" type="text" placeholder="예: 우유, 빵, 사과..." maxlength="80">
      <button id="add-btn">추가</button>
    </div>
    <ul id="list"></ul>
    <footer>
      <span id="status">0개 항목</span>
      <button id="clear-btn">전체 삭제</button>
    </footer>
  </div>

<script>
  const STORAGE_KEY = "shopping-list-items";
  const input = document.getElementById("item-input");
  const addBtn = document.getElementById("add-btn");
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const clearBtn = document.getElementById("clear-btn");

  let items = loadItems();

  function loadItems() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveItems() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function render() {
    list.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "아직 항목이 없어요. 위에서 추가해보세요!";
      list.appendChild(empty);
    } else {
      items.forEach((item) => {
        const li = document.createElement("li");
        if (item.checked) li.classList.add("checked");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.checked;
        checkbox.addEventListener("change", () => toggleItem(item.id));

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = item.text;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "×";
        delBtn.title = "삭제";
        delBtn.addEventListener("click", () => deleteItem(item.id));

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }
    const checkedCount = items.filter((i) => i.checked).length;
    status.textContent = `${items.length}개 항목 · ${checkedCount}개 완료`;
  }

  function addItem() {
    const text = input.value.trim();
    if (!text) return;
    items.push({ id: Date.now() + Math.random(), text, checked: false });
    input.value = "";
    saveItems();
    render();
    input.focus();
  }

  function toggleItem(id) {
    const item = items.find((i) => i.id === id);
    if (item) {
      item.checked = !item.checked;
      saveItems();
      render();
    }
  }

  function deleteItem(id) {
    items = items.filter((i) => i.id !== id);
    saveItems();
    render();
  }

  function clearAll() {
    if (items.length === 0) return;
    if (confirm("모든 항목을 삭제할까요?")) {
      items = [];
      saveItems();
      render();
    }
  }

  addBtn.addEventListener("click", addItem);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addItem();
  });
  clearBtn.addEventListener("click", clearAll);

  render();
  input.focus();
</script>
</body>
</html>
